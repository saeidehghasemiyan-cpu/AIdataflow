<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pip Reads Real Articles</title>
<meta name="description" content="A 60-minute team game: travel Pip's road and crack real expert texts about AI and data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800;900&family=Patrick+Hand&display=swap">
<style>
/* Layout: the Pip site's sticker world. Home = Pip's road map with 10 stops; each stop opens its own mission page with 4 steps; stamps collect in a passport; report at the end */
:root{
  --bg:#e9f5f1; --dot:#c6e2d9; --card:#ffffff; --ink:#1b2140; --muted:#525a80;
  --pip:#ffc933; --pink:#ff8090; --mint:#35d3a8; --sky:#9ad8ff; --lilac:#c8b6ff;
  --good:#17885a; --bad:#d6373c; --on:#1b2140; --shade:#1b2140; --note:#fff4bf;
  --f-d:"Bagel Fat One","Baloo 2",system-ui,sans-serif;
  --f-b:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-h:"Patrick Hand","Comic Sans MS",cursive;
  --f-m:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141833; --dot:#232a55; --card:#222a55; --ink:#f6f3e6; --muted:#b3b9dc; --sky:#3f74bd; --lilac:#6a58c2;
  --good:#4ad295; --bad:#ff7a7f; --on:#141833; --shade:#05060f; --note:#4a4220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141833; --dot:#232a55; --card:#222a55; --ink:#f6f3e6; --muted:#b3b9dc; --sky:#3f74bd; --lilac:#6a58c2;
  --good:#4ad295; --bad:#ff7a7f; --on:#141833; --shade:#05060f; --note:#4a4220; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg) radial-gradient(var(--dot) 1.5px,transparent 1.7px) 0 0/22px 22px;color:var(--ink);
  font:500 17px/1.55 var(--f-b);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--f-d);font-weight:400;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
.wrap{max-width:1000px;margin-inline:auto;display:flex;flex-direction:column;gap:24px;padding-top:24px}
.hand{font-family:var(--f-h);font-size:21px}

/* bar */
.bar{position:sticky;top:0;z-index:20;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:3px solid var(--ink)}
.bar .in{max-width:1000px;margin-inline:auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.brand{font-family:var(--f-d);font-size:20px;display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0;text-decoration:none}
.brand::before{content:"";width:20px;height:20px;border-radius:7px;border:3px solid var(--ink);background:conic-gradient(var(--pip) 0 50%,var(--mint) 0);animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tm{font:900 13px var(--f-b);border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px;background:var(--pip);color:var(--on);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.pass{font:900 13px var(--f-b);border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px;background:var(--card);text-decoration:none;white-space:nowrap}
.clock{display:flex;align-items:center;gap:6px}
.clock b{font:400 20px var(--f-d);min-width:96px;text-align:center;border:2.5px solid var(--ink);border-radius:12px;padding:1px 8px;background:var(--card);font-variant-numeric:tabular-nums}
.saved{font:800 13px var(--f-b);color:var(--good);min-width:58px}

/* buttons */
.b{font:800 16px var(--f-b);padding:9px 18px;border:3px solid var(--ink);border-radius:999px;background:var(--c,var(--pip));color:var(--on);box-shadow:3px 3px 0 var(--shade);text-decoration:none;display:inline-block;
  transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .08s}
.b:hover{transform:translateY(-2px) rotate(-1.5deg) scale(1.03)}
.b:active{transform:translateY(3px);box-shadow:0 0 0 var(--shade)}
.b.alt{background:var(--card);color:var(--ink)}
.b.sm{font-size:13px;padding:5px 11px}
.b[disabled]{opacity:.45;pointer-events:none}

/* gate */
.gate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px)}
.gate .box{width:min(520px,100%);background:var(--card);border:4px solid var(--ink);border-radius:30px;box-shadow:9px 9px 0 var(--shade);padding:26px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.gate h2{font-size:34px}
.gate input{width:100%;font:800 22px var(--f-b);text-align:center;color:var(--ink);background:var(--bg);border:3px solid var(--ink);border-radius:16px;padding:10px}
.gate .err{color:var(--bad);font-weight:800;min-height:1.4em}
.gate .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:center}
.hero h1{font-size:clamp(40px,7vw,74px);text-shadow:4px 4px 0 var(--card),7px 7px 0 var(--ink)}
.hero h1 em{font-style:normal;display:inline-block;padding:0 .12em;background:var(--pip);color:#1b2140;border:4px solid var(--ink);border-radius:18px;transform:rotate(-3deg);text-shadow:none;animation:wig 2.6s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(3deg) scale(1.04)}}
.hero p.lead{font-size:19px;font-weight:700;margin-top:14px;max-width:48ch}
.pipbox{display:flex;flex-direction:column;align-items:center}
.pipbox svg{animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:none}30%{transform:translateY(-14px)}}
.bubble{font:400 21px var(--f-h);background:var(--note);border:3px solid var(--ink);border-radius:18px;padding:6px 14px;margin-bottom:10px;transform:rotate(-3deg);position:relative;text-align:center}
.bubble::after{content:"";position:absolute;left:46%;bottom:-12px;width:18px;height:18px;background:var(--note);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.plan{display:flex;flex-wrap:wrap;gap:10px}
.plan span{font-weight:800;border:2.5px solid var(--ink);border-radius:14px;padding:6px 12px;background:var(--card)}
.plan span i{font-style:normal;font-family:var(--f-d);margin-right:6px}

.stretch{display:flex;flex-direction:column;gap:12px}
.stretch h3{font-size:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stretch h3 small{font:800 14px var(--f-b);color:var(--muted)}
.road{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:6px 0 26px}
.road::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;border:3px solid var(--ink);border-radius:999px;background:repeating-linear-gradient(90deg,var(--card) 0 18px,var(--ink) 18px 22px);animation:road 1.6s linear infinite}
@keyframes road{to{background-position:-22px 0}}
.stop{--c:var(--pip);position:relative;text-align:left;text-decoration:none;display:flex;flex-direction:column;gap:6px;border:3px solid var(--ink);border-radius:22px;padding:14px 16px 16px;background:color-mix(in srgb,var(--c) 28%,var(--card));box-shadow:5px 5px 0 var(--shade);transition:transform .15s}
.stop:nth-child(odd){transform:rotate(-1deg)}.stop:nth-child(even){transform:rotate(1deg)}
.stop:hover{transform:translateY(-5px) rotate(0) scale(1.02)}
.stop .st{font:900 12px var(--f-b);letter-spacing:.06em;text-transform:uppercase}
.stop .ic{font-size:34px;line-height:1}
.stop h4{font-size:21px}
.stop p{font-size:14px;font-weight:700;color:var(--muted)}
.stamp{position:absolute;top:-14px;right:-10px;width:66px;height:66px;border-radius:50%;border:3px dashed var(--good);color:var(--good);background:var(--card);display:grid;place-items:center;text-align:center;font:400 12px/1 var(--f-d);transform:rotate(14deg);box-shadow:2px 2px 0 var(--shade)}
.stamp b{display:block;font-size:22px}
.started{position:absolute;top:-10px;right:-6px;font:900 11px var(--f-b);border:2px solid var(--ink);border-radius:999px;padding:2px 8px;background:var(--sky);color:#1b2140}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.extra{--c:var(--sky);display:flex;gap:14px;align-items:center;border:3px solid var(--ink);border-radius:22px;padding:14px 16px;background:color-mix(in srgb,var(--c) 30%,var(--card));box-shadow:5px 5px 0 var(--shade);text-decoration:none}
.extra .ic{font-size:38px}
.extra h4{font-size:22px}
.extra p{font-size:14px;font-weight:700;color:var(--muted)}

/* panels */
.panel{background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--shade);padding:22px 24px}

/* warm-up */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.col{display:flex;flex-direction:column;gap:10px}
.col h4{font:400 20px var(--f-d)}
.pick{font-weight:800;text-align:left;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;background:var(--card);box-shadow:3px 3px 0 var(--shade);transition:transform .12s}
.pick.term{font-family:var(--f-m);font-weight:700;font-size:15px}
.pick:hover{transform:translateY(-2px)}
.pick.sel{background:var(--sky)}
.pick.done{background:color-mix(in srgb,var(--mint) 45%,var(--card));box-shadow:none;cursor:default;transform:none}
.pick.nope{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mstat{font:400 22px var(--f-h);margin-top:12px}

/* mission page */
.mhead{--c:var(--pip);display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.mhead .num{font:400 18px/1.1 var(--f-d);width:64px;height:64px;display:grid;place-items:center;text-align:center;border:3px solid var(--ink);border-radius:20px;background:var(--c);color:#1b2140;transform:rotate(-6deg);box-shadow:4px 4px 0 var(--shade)}
.mhead h2{font-size:clamp(28px,4.4vw,44px);background:linear-gradient(transparent 60%,color-mix(in srgb,var(--c) 70%,transparent) 60%);padding-right:6px}
.mhead .kind{font-weight:900;font-size:13px;border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px;background:var(--card)}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font:800 15px var(--f-b);border:3px solid var(--ink);border-radius:999px;padding:6px 14px 6px 6px;background:var(--card)}
.step i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2.5px solid var(--ink);font-family:var(--f-d);font-size:14px;background:var(--bg)}
.step[aria-current="step"]{background:var(--c);color:#1b2140}
.step.ok i{background:var(--good);color:#fff}
.pane{min-height:340px}

.flip{perspective:1200px;max-width:640px;margin-inline:auto;width:100%}
.flip .inner{position:relative;display:grid;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:300px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--ink);border-radius:28px;box-shadow:8px 8px 0 var(--shade);padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.face.front{background:color-mix(in srgb,var(--c) 40%,var(--card))}
.face.front h3{font-size:clamp(24px,3.6vw,34px)}
.face.back{background:var(--note);transform:rotateY(180deg);align-items:flex-start;text-align:left}
.face.back p{font:400 21px/1.4 var(--f-h)}
.face.back b{font-family:var(--f-b);font-weight:900;font-size:.85em;background:color-mix(in srgb,var(--c) 40%,transparent);padding:0 3px;border-radius:4px}
.pw{width:100%;margin-top:6px;border-top:2.5px dashed var(--ink);padding-top:10px}
.pwh{font:400 18px var(--f-d)!important;margin-bottom:6px}
.pw dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;align-items:baseline}
.pw dt{font:900 14px var(--f-b);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;background:var(--card)}
.pw dd{margin:0;font:400 19px/1.3 var(--f-h)}
@media (max-width:520px){.pw dl{grid-template-columns:1fr}.pw dd{margin-bottom:6px}}
.pw span{font:800 13px var(--f-b);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--card)}
.flip{max-width:760px}
.face.back h4{font-size:20px}

.reader{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.reader>*{min-width:0}
.src{font-weight:800;font-size:14px;color:var(--muted);margin-bottom:8px}
.ctx{font-weight:700;color:var(--muted);margin-bottom:10px}
.quote{border:3px solid var(--ink);border-radius:18px;background:color-mix(in srgb,var(--sky) 16%,var(--card));padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.quote p{font-family:var(--f-m);font-size:15px;line-height:1.65}
.quote p::before{content:"› ";font-weight:900;color:var(--muted)}
.ql{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.simpb{font:800 12px var(--f-b);border:2px solid var(--ink);border-radius:999px;padding:1px 9px;background:var(--note);color:var(--ink)}
.quote p.simple{font:400 20px/1.35 var(--f-h);background:var(--note);border:2px dashed var(--ink);border-radius:12px;padding:6px 10px}
.quote p.simple::before{content:"🐣 "}
.about{border:3px solid var(--ink);border-radius:18px;background:var(--note);padding:12px 16px;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.about p{font:400 19px/1.35 var(--f-h)}
.about b{font:800 14px var(--f-b);display:block}
.quote p.qsrc{font:400 18px var(--f-d);margin-top:4px}
.quote p.qsrc::before{content:"📄 "}
.hw{font:inherit;color:inherit;background:color-mix(in srgb,var(--c) 45%,transparent);border:0;border-bottom:3px dotted var(--ink);border-radius:4px;padding:0 2px;cursor:pointer}
.hw.got{background:color-mix(in srgb,var(--good) 25%,transparent);border-bottom-style:solid}
.reader1{display:flex;flex-direction:column;gap:12px}
.crackbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;background:var(--card)}
.crackbar .hand{flex:1 1 260px}
.hw2{font:inherit;color:inherit;background:none;border:0;border-bottom:2.5px dotted var(--ink);padding:0;cursor:help}
.hw2:hover{background:var(--note)}
.def b{font:800 14px var(--f-b);display:block}
.def{display:inline-block;max-width:100%;vertical-align:top;font:400 19px/1.3 var(--f-h)!important;color:var(--ink);background:var(--note);border:2px solid var(--ink);border-radius:10px;padding:1px 8px;margin:0 4px;box-shadow:2px 2px 0 var(--shade);animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.decoder{position:sticky;top:90px;display:flex;flex-direction:column;align-items:center;gap:6px}
.decoder .bubble{width:100%;transform:rotate(-1.5deg);min-height:120px;display:flex;flex-direction:column;justify-content:center;font-size:20px}
.decoder .bubble b{font:700 15px var(--f-m);display:block;margin-bottom:4px}
.meter{font:800 14px var(--f-b);color:var(--muted)}

.quiz{max-width:640px;margin-inline:auto;width:100%;display:flex;flex-direction:column;gap:10px}
.quiz h3{font-size:clamp(24px,3.4vw,32px);text-align:center}
.quiz button.o{font:800 18px var(--f-b);text-align:left;border:3px solid var(--ink);border-radius:18px;padding:12px 16px;background:var(--card);box-shadow:3px 3px 0 var(--shade)}
.quiz button.o:hover{transform:translateY(-2px)}
.quiz button.o.right{background:color-mix(in srgb,var(--good) 30%,var(--card))}
.quiz button.o.wrong{background:color-mix(in srgb,var(--bad) 25%,var(--card))}
.quiz .fb{font:400 22px var(--f-h);text-align:center;min-height:1.5em}

.talk{display:flex;flex-direction:column;gap:16px}
.agree{border:3px solid var(--ink);border-radius:22px;padding:16px 18px;background:color-mix(in srgb,var(--c) 22%,var(--card));display:flex;flex-direction:column;gap:12px}
.agree .stmt{font:400 clamp(20px,2.6vw,26px)/1.2 var(--f-d)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale button{border:3px solid var(--ink);border-radius:16px;padding:8px 4px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:2px;font:800 12px var(--f-b);line-height:1.2;text-align:center}
.scale button span{font-size:26px;line-height:1}
.scale button[aria-pressed="true"]{background:var(--pip);color:#1b2140;transform:translateY(-3px) rotate(-2deg);box-shadow:3px 3px 0 var(--shade)}
.case{border:4px solid var(--ink);border-radius:24px;padding:18px 20px;background:color-mix(in srgb,var(--c) 30%,var(--card));box-shadow:6px 6px 0 var(--shade);display:flex;flex-direction:column;gap:8px}
.case h3{font-size:clamp(24px,3.4vw,32px)}
.facts{background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px}
.facts .fh{font:400 18px var(--f-d);margin-bottom:4px}
.facts ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-weight:700}
.q.dp{background:color-mix(in srgb,var(--lilac) 22%,var(--card))}
.case .story{font-weight:700;font-size:18px}
.case .goal{font-weight:700;font-size:18px;background:var(--card);border:2.5px dashed var(--ink);border-radius:14px;padding:8px 12px}
.dec{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.dec button{border:3px solid var(--ink);border-radius:16px;padding:10px 12px;background:var(--card);display:flex;gap:8px;align-items:flex-start;text-align:left;font:800 15px/1.3 var(--f-b)}
.dec button span{font-size:20px;line-height:1}
.dec button[aria-pressed="true"]{background:var(--pip);color:#1b2140;transform:translateY(-3px) rotate(-1deg);box-shadow:3px 3px 0 var(--shade)}
.q{border:3px solid var(--ink);border-radius:20px;padding:14px 16px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.q .ask{font-weight:800;font-size:18px}
.q .ask span{font-family:var(--f-d);font-weight:400;margin-right:8px}
.q details summary{font-weight:900;font-size:14px;cursor:pointer;display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:1px 10px;background:var(--bg)}
.q details p{margin-top:6px;font:400 19px/1.35 var(--f-h)}
.q.own{border-style:dashed;background:transparent}
textarea{width:100%;min-height:80px;font:600 16px/1.45 var(--f-b);color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;resize:vertical}
textarea::placeholder{color:var(--muted);font-weight:600}
.nav2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

.celebrate{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(4px);padding:16px}
.celebrate .box{background:var(--card);border:4px solid var(--ink);border-radius:30px;box-shadow:9px 9px 0 var(--shade);padding:26px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;width:min(460px,100%)}
.bigstamp{width:150px;height:150px;border-radius:50%;border:5px dashed var(--good);color:var(--good);display:grid;place-items:center;font:400 20px/1.05 var(--f-d);animation:thump .6s cubic-bezier(.3,1.8,.5,1)}
.bigstamp b{display:block;font-size:44px}
@keyframes thump{from{transform:scale(2.4) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(12deg);opacity:1}}

/* report */
.letter{background:var(--note);border:3px solid var(--ink);border-radius:6px 22px 22px 22px;padding:18px 20px;box-shadow:5px 5px 0 var(--shade);display:flex;flex-direction:column;gap:8px}
.letter p{font:400 22px/1.4 var(--f-h)}
.letter textarea{font:400 20px var(--f-h)}
.rep{display:flex;flex-direction:column;gap:12px}
.rep h3{font-size:30px}
.rep h4{font:400 22px var(--f-d);margin-top:8px}
.rep .meta{font-weight:800;color:var(--muted)}
