<script>
const pip=(s=90,c='var(--pip)')=>`<svg width="${s}" height="${Math.round(s*1.1)}" viewBox="0 0 100 110" aria-hidden="true"><path d="M34 90v12M66 90v12" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="12" y="22" width="76" height="70" rx="26" fill="${c}" stroke="var(--ink)" stroke-width="4"/><circle cx="37" cy="50" r="9" fill="#fff" stroke="#1b2140" stroke-width="3"/><circle cx="63" cy="50" r="9" fill="#fff" stroke="#1b2140" stroke-width="3"/><circle cx="39" cy="52" r="4" fill="#1b2140"/><circle cx="65" cy="52" r="4" fill="#1b2140"/><path d="M40 70q10 9 20 0" fill="none" stroke="#1b2140" stroke-width="4" stroke-linecap="round"/><path d="M30 82h40" stroke="#1b2140" stroke-width="3" stroke-dasharray="6 5" fill="none" stroke-linecap="round"/></svg>`;

const MATCH=[
 ['token','A small piece of a word','An AI never reads whole words. A tool chops text into pieces and gives each piece a number. “Miso” became “Mis” + “o”. Counting tokens is how builders measure how big a pile of text is.'],
 ['deduplication','Throwing away extra copies, so each text is kept only once'],
 ['test set','The exam box: questions the AI must never see while learning'],
 ['memorisation','The AI knows a piece of its training text by heart'],
 ['fine-tuning','The finishing school: a short extra course on chosen examples'],
 ['checkpoint','A “save game” of the model while it learns'],
];

const STRETCHES=[['The data stretch','Pip is collected, washed and sorted'],['The model stretch','Pip becomes a tiny trace inside the AI'],['The world stretch','The AI goes out, gets old, and must forget']];

const ALL=[
{id:'wash',ic:'🧼',c:'var(--pip)',name:'The big wash',teaser:'How a giant pile of web pages gets scrubbed.',kind:'📄 Research paper · 2024',
 about:["A team at Hugging Face, a company that shares free AI tools and data.", "They built FineWeb: a giant pile of web pages, cleaned up so anyone can use it to train an AI. In this text they explain, step by step, how they cleaned it.", "This is Pip’s wash in real life. Watch closely what gets removed, and what does NOT."],case:{"t": "MSF stories as training data", "story": ["MSF has thousands of stories on its websites and social media: blogs written by field staff, and testimonies from patients about their illness, their journey, or the violence they lived through.", "The communication team wants an AI writing assistant that writes in “the MSF voice”. Their idea: fine-tune an AI on 10 years of these texts, in English, French and Arabic.", "They ask you to plan “the wash”: what must be cleaned out before any text goes into training."], "facts": ["Some testimonies use full names and photos; others use first names only.", "Patients agreed to have their story published in a campaign. Nobody mentioned AI.", "Some stories are about sexual violence, HIV or detention.", "The same story often exists on several websites and in several languages."], "goal": "Write the washing plan: what must be removed, what can stay, and what a wash alone can’t fix."},decide:["What do you recommend to the communication team?", ["Use everything, after blanking out emails", "Use only stories with clear consent, after a careful wash and a human check", "Don’t use patient testimonies at all"], "Why? What is the one condition you would never drop?"],

 front:'Close your eyes and remember Pip’s trip, from Lina’s laptop to the wash. What happened?',
 back:['Lina wrote a post about her cat on her little blog. One sentence was Pip: **“My cat Miso sleeps on the warm laptop.”**',
  'One day a **crawler** came by. A crawler is a robot that visits millions of websites and copies them. It didn’t copy only Pip: it copied the **whole page**, with the menus, the ads, the hidden code, and maybe Lina’s name and email too.',
  'That messy copy, the **dirty Pip**, was put on a shelf in the **raw warehouse**, next to billions of other pages.',
  'Then came **the wash**. Robots threw away **junk** (ads, menus, spam), **harmful pages**, **repeats** (the same page copied many times) and **private details** like email addresses.',
  'Why throw away repeats? Because an AI that sees the same text again and again can learn it **by heart**.',
  'The wash made a **new, clean copy** of Pip. But the dirty Pip was not erased: it is **still upstream**, in the warehouse.'],
 words:[["crawler", "A robot that visits websites and copies them."], ["raw warehouse", "Where the messy first copies are stored."], ["the wash", "The cleaning step: junk, repeats and private details go out."], ["repeats (duplicates)", "The same text copied many times."], ["dirty Pip / clean Pip", "The messy first copy / the new washed copy."]],
 src:[['Penedo and others, “The FineWeb Datasets”, NeurIPS 2024','https://arxiv.org/pdf/2406.17557']],
 ctx:'FineWeb is one of the biggest open piles of web text used to train AIs. In their paper, its makers explain how they washed it. Each line has a 🐣 button if you want it in simple words.',
 quote:[
  ['“we introduce FineWeb, a 15-trillion token dataset derived from 96 Common Crawl snapshots”','We made a giant pile of web text: 15 trillion word pieces, taken from 96 big copies of the internet.'],
  ['“WARC (Web ARChive format) files contain the raw data from the crawl, including the full page HTML and request metadata.”','The raw copy keeps everything from a web page: the words, the hidden code, and notes about when and where it was copied. This is the dirty Pip!'],
  ['“we applied URL filtering using a blocklist […] to remove adult content,”','We threw away every page from websites on a “bad list”.'],
  ['“applied a fastText language classifier […] to keep only English text with a score >= 0.65,”','A little robot guessed the language of each page. We kept a page only if the robot was at least 65% sure it was English.'],
  ['“applied quality and repetition filters […], using the original thresholds.”','We threw away low-quality pages, and pages that say the same thing again and again.'],
  ['To find copies, “we chose to collect each document’s 5-grams” […] “targeting documents that are at least 75% similar.”','We cut every page into groups of 5 words and compared them. If two pages were 75% the same, we kept only one.'],
  ['“We anonymize email addresses and public IP addresses using regex patterns.”','We searched for things shaped like an email, or like a computer’s internet address, and blanked them out.']],
 jar:[['token','A small piece of a word. Pip became 10 tokens.'],['Common Crawl snapshots','Huge public copies of the internet, each taken at one moment, like a photo.','Common Crawl is a free project that copies billions of web pages several times a year. Each copy is a “snapshot”. Many AI builders start from these instead of running their own crawler, so Lina’s blog may be in it many times.'],['WARC','The raw “as copied” file of a web page: the dirty Pip.','Short for “Web ARChive”. It keeps the page exactly as the crawler found it, so it is the richest copy, and also the one with the most hidden details. It lives in the raw warehouse.'],['HTML','The hidden code that builds a web page.','Every web page is made of HTML: instructions that say “this is a title”, “this is a menu”, “put a picture here”. The crawler copies this code along with the words.'],['metadata','Data about the data: when it was copied, and from where.','For a web page: the address, the date it was copied, the type of page. Metadata can be personal too, for example an address that contains someone’s name.'],['blocklist','A list of bad websites.','Builders keep lists of websites they never want in their pile, for example adult sites. Anything from those addresses is thrown away without being read.'],['language classifier','A robot that guesses which language a page is written in.','It is itself a small AI. It reads a page and gives a score for each language. It can be wrong, especially with mixed languages or less common ones.'],['repetition filters','Rules that throw away text repeating itself.','Some pages repeat the same line over and over (spam, lists, broken pages). These filters measure how much a page repeats itself and throw it away above a limit.'],['5-grams','Groups of 5 words in a row.','“My cat Miso sleeps on” is one 5-gram, “cat Miso sleeps on the” is the next. Comparing these small groups is a fast way to see if two pages are almost the same.'],['75% similar','Three quarters the same.','The builders chose this limit themselves. Two pages that share 3 out of 4 of their word groups are treated as copies, and only one is kept.'],['anonymize','Blank out, so nobody can be recognised.','Here it only means: blank out emails and internet addresses. Real anonymisation means nobody can be recognised at all, which is much harder. Names and street addresses were NOT removed.'],['regex patterns','Search shapes, like “something@something.com”.','“Regex” is short for “regular expression”: a recipe for finding text by its shape. Great for emails or phone numbers, useless for names, which have no special shape.']],
 agree:'Blanking out emails but keeping names is not enough privacy for a training dataset.',
 qs:[["FineWeb’s wash only blanks out emails and internet addresses. List the details in a patient testimony that this would NOT catch. Which of them could identify a patient in a small village?", "Names, ages, the village, the date, a rare illness, “the only midwife in the camp”… Put two or three together and someone is recognisable."], ["Many testimonies were published with consent for a campaign, not for AI training. Does “it’s already public on our website” make it OK to train an AI on it? What would you check first?", "Think about what the person agreed to, when, and whether they could imagine this use."], ["FineWeb kept only pages that a robot was 65% sure were English. If MSF used the same rule, what would happen to the French and Arabic stories, and to the people in them?", "Whose voices would be washed away? What would the assistant then be bad at?"], ["🔒 The testimonies were collected to tell people’s stories in a campaign. Training an AI is a new purpose. How would you decide if the new purpose fits the old one? What would make it clearly NOT fit?", "Think: what did people expect when they told their story? How sensitive is it? Could the new use harm them? What extra protection could you add?"], ["🔒 After blanking out emails and names, is the training pile now “anonymous”, or only “pseudonymised”? Explain the difference with an example from a testimony, and why it changes which rules still apply.", "Anonymous = nobody can be recognised by any reasonable means, even by combining details. If someone can still be recognised (“the only nurse in the village who…”), it is still personal data."]],
 quiz:['A page about Lina’s cat, written in French, would…',['be kept','be thrown away by the language robot','be translated into English'],1,'Only English pages stayed. Choosing a language changes whose voices the AI hears.']},
{id:'exam',ic:'📝',c:'var(--pip)',name:'The leaky exam',teaser:'A bug, an exam, and an AI too costly to fix.',kind:'📄 Two research papers · 2020 + 2022',
 about:["OpenAI, the company behind ChatGPT, writing about GPT-3, an earlier AI (2020). Then researchers at Google (2022).", "Every AI is tested with famous exams. But those exams are on the internet, so the AI may have read them while it was learning. Here OpenAI admits this happened, and Google shows how common it is.", "When a company shows MSF a great score, we need to know if the score is real."],case:{"t": "A shiny score", "story": ["A company wants to sell MSF an AI “triage helper”. A nurse types in a patient’s symptoms, and the AI suggests how urgent the case is.", "In the sales meeting they show one big number: “Our AI scored 92% on a famous medical exam!”", "The medical director is impressed, but careful. She asks you: can we trust this number, and what should we check before testing it in a clinic?"], "facts": ["The famous exam has been freely available online for years.", "The company won’t say exactly what data the AI learned from: “trade secret”.", "The AI learned mostly from English text from rich countries.", "MSF clinics see many cases (malnutrition, cholera, snakebites) that are rare in those countries."], "goal": "Prepare the checks MSF must do before trusting the score."},decide:["What do you tell the medical director?", ["Trust the 92% and go ahead", "Ask for proof the exam was not in training, and test it ourselves first", "Reject the tool"], "Why? What would make you change your answer?"],

 front:'Remember the station with the three boxes? Where did Pip go, and what is the golden rule?',
 back:['After the wash, Pip was turned into numbers. It was chopped into small pieces called **tokens** (My · cat · Mis · o · sleeps …) and each piece got a number.',
  'Then all the data was dealt into **three boxes**, like a card game: the **learning box** (training set), where the AI studies; the **practice box** (validation set), to check progress during school; and the **exam box** (test set), for the final exam.',
  'Pip landed in the learning box, like most of the data.',
  'The golden rule: the exam box must **never** touch the learning box. If the AI has already seen the exam questions while studying, it just remembers the answers. Its score looks great, but **the score is a lie**.',
  'It’s like a student who found the exam paper the night before: a perfect grade, but did they really learn anything?',
  'Copies make this hard. If the same text sits in two boxes, the wall has **leaked**.'],
 words:[["tokens", "Small pieces of words, each with a number."], ["training set", "The learning box: what the AI studies."], ["validation set", "The practice box: checks progress during school."], ["test set", "The exam box: the final test."], ["leak", "When exam text also sits in the learning box."]],
 src:[['Brown and others (OpenAI), “Language Models are Few-Shot Learners” (GPT-3), 2020','https://arxiv.org/pdf/2005.14165'],['Lee and others (Google), “Deduplicating Training Data Makes Language Models Better”, ACL 2022','https://aclanthology.org/2022.acl-long.577']],
 ctx:'GPT-3 was a famous AI trained on a huge amount of web text. In their own paper, its makers admitted a problem with the exam box. A later Google paper showed how common this problem is.',
 quote:['§ The GPT-3 paper (OpenAI, 2020)',
  ['A concern “is potential contamination of downstream tasks by having their test or development sets inadvertently seen during pre-training.”','A worry: the AI may have seen the exam questions by accident while it was studying.'],
  ['“Unfortunately, a bug in the filtering caused us to ignore some overlaps, and due to the cost of training it was not feasible to retrain the model.”','Oops: a mistake in our cleaning tool missed some exam questions. Teaching the AI again would cost too much, so we didn’t.'],
  ['“Unfortunately, a bug resulted in only partial removal of all detected overlaps from the training data.”','Because of the mistake, only some of the leaked exam questions were taken out of the learning box.'],
  ['“it is possible that our model was trained on some of our benchmark test sets.”','So our AI may have studied some of the exams we then tested it on.'],
  '§ The deduplication paper (Google, 2022)',
  ['“existing language modeling datasets contain many near-duplicate examples and long repetitive substrings.”','The big text piles are full of almost-identical copies and long repeated chunks.'],
  ['Train-test overlap “affects over 4% of the validation set of standard datasets”.','More than 4 in every 100 practice questions were also in the learning box.']],
 jar:[['contamination','Exam questions sneaking into the learning data.','Like a scientist’s sample getting dirty. Here the “dirt” is exam questions that ended up in the learning pile, so the test no longer measures real skill.'],['downstream tasks','The jobs the AI is tested on later.','After the big school, the AI is tested on many small tasks: answering questions, translating, summarising. Each task usually has its own exam.'],['test or development sets','The exam box and the practice box.','The test set is the final exam box. The development set is another name for the practice box (validation set). Both must stay out of the learning box.'],['inadvertently','By accident.','Nobody did it on purpose. The web is so big that exam questions simply sit on many pages, and the crawler copied them along with everything else.'],['pre-training','The big school, where the AI learns from the huge pile of text.','The first, giant learning step on a huge pile of text, before any finishing school. Pip was used here.'],['filtering','The step that was supposed to take the exam questions out.','Here: a tool that searched the learning pile for exam questions and removed them. A bug meant it missed some.'],['overlaps','Texts that ended up in two boxes.','A piece of text found in both the learning box and the exam box. Even a long shared sentence counts.'],['retrain','Send the AI back to school from the start. Very expensive!','Training a big AI can take weeks of thousands of computers and cost millions. That is why builders avoid starting again, even after finding a mistake.'],['benchmark','A famous standard exam everyone uses to compare AIs.','A famous shared test, so that everyone can compare AIs on the same questions. Because they are famous, they are also all over the internet.'],['near-duplicate','Almost the same text, with tiny changes.','For example the same news story on two websites, with a different title and an extra line. Exact-copy checks miss these; you need smarter tools like the 5-gram comparison.'],['substrings','Pieces of text inside a longer text.','If a text is a train, a substring is a few carriages from the middle. A long substring repeated across many pages is easy for an AI to learn by heart.'],['validation set','The practice box.','The practice box. Builders check the AI on it while it learns, to choose settings. If it overlaps with the learning box, the progress looks better than it really is.']],
 agree:'If exam questions leaked into training, the company should not be allowed to publish the score.',
 qs:[["The famous exam has been online for years. What could have happened while the AI was learning? Write the exact question you would ask the company.", "Remember OpenAI’s bug: the cleaning tool missed some exam questions, and retraining was too expensive."], ["Design a small fair test of your own, with questions you are sure the AI has never seen. Who in MSF should write them, and what should they be about?", "Brand-new questions, written after the AI was trained, about the cases MSF teams really see."], ["Even a clean score only shows how the AI does on that exam. What would you also need to know before using it with patients in an MSF project?", "Languages, local diseases, what happens when it is wrong, who checks its answers."], ["🔒 You ask the company what data the AI learned from. They say: “trade secret”. As a buyer, what can MSF reasonably demand, and what should go into the contract?", "Documentation of the training data, independent test results, the right to audit or test, a promise not to use MSF’s data to train their AI."], ["🔒 To build your own fair test, a doctor suggests using real old patient cases as exam questions and sending them to the company. What data protection problems does that create? How could you build test cases without real patient data?", "Think about sharing health data with a vendor, rare cases that are easy to recognise, and invented or carefully anonymised cases."]],
 quiz:['Why didn’t they fix the mistake?',['they never noticed it','teaching the AI again would cost too much','it was against the law'],1,'The bigger the AI, the more expensive every mistake in the data becomes.']},
{id:'remember',ic:'🦜',c:'var(--pink)',name:'Can it remember?',teaser:'Phone numbers pulled out of an AI.',kind:'📄 Two research papers · 2021 + 2022',
 about:["Researchers from Google, OpenAI, Apple and several universities (2021). Then researchers at Google (2022).", "They tested whether an AI keeps private things from its training, and whether someone can get them out just by asking questions.", "If MSF ever trains an AI on documents with patient details, this is exactly the risk."],case:{"t": "Reports with names inside", "story": ["A mission writes long medical reports every week. Writing summaries for headquarters takes hours.", "The team wants to fine-tune an AI on 3 years of these reports, so it can write the summaries automatically.", "The reports contain patient names, ages, villages, medical record numbers, and sometimes phone numbers of family members."], "facts": ["Many reports use the same template, so some sentences repeat hundreds of times.", "Some patients appear in many reports over several months.", "About 40 staff would use the AI, some of them outside the mission.", "Record numbers are long and unique, just like the ID codes that came out in the research paper."], "goal": "Decide how to stop the AI from repeating patient details, and what to do if it does."},decide:["What is your plan for the mission?", ["Train on the reports as they are", "Remove identifiers and copies, then test for leaks before anyone uses it", "Don’t train on reports: use anonymised summaries, or no AI"], "Why? What is the biggest risk you are trying to avoid?"],

 front:'Pip went to school inside the AI. After school, is Pip stored in there?',
 back:['At **the school**, the AI read the learning box, sentence by sentence, and played a guessing game: **guess the next word**.',
  'When Pip came, the AI tried: “My cat Miso sleeps on the warm…” → ? When it guessed wrong, its billions of little **knobs** (the weights) got a **tiny nudge**, so it would guess better next time.',
  'Pip’s nudge was tiny, and mixed with the nudges of millions of other sentences. So after school, **Pip is not stored in the AI**. There is no folder with Lina’s sentence. Only knob settings.',
  'But careful: an AI can learn some things **by heart**. This is **memorisation**. It happens when a text appears many, many times, when it is very unusual (like a phone number), or when the AI is very big.',
  'When the AI says something learned by heart back, word for word, that is **regurgitation**. If it is someone’s private details, it is a **privacy leak**.',
  'Pip appeared only once and is ordinary, so Pip was not memorised. That’s why the wash, removing repeats and private details, matters so much.'],
 words:[["knobs (weights)", "The billions of numbers the AI adjusts while it learns."], ["nudge", "A tiny change to the knobs."], ["memorisation", "Learning something by heart."], ["regurgitation", "Saying learned-by-heart text back, word for word."], ["privacy leak", "Private details coming out where they shouldn’t."]],
 src:[['Carlini and others, “Extracting Training Data from Large Language Models”, USENIX Security 2021','https://arxiv.org/pdf/2012.07805'],['Lee and others (Google), “Deduplicating Training Data Makes Language Models Better”, ACL 2022','https://aclanthology.org/2022.acl-long.577']],
 ctx:'Researchers asked: can you get private things out of an AI just by asking it questions? They tried on GPT-2, an older AI. A second team measured how copies in the data make AIs repeat text.',
 quote:['§ The extraction paper (2021)',
  ['When big AIs are trained on private data, “an adversary can perform a training data extraction attack to recover individual training examples by querying the language model.”','We show that an attacker can pull real training text out of such an AI, just by asking it questions.'],
  ['“We demonstrate our attack on GPT-2, a language model trained on scrapes of the public Internet, and are able to extract hundreds of verbatim text sequences from the model’s training data.”','We tried it on GPT-2, an AI that learned from copied web pages, and pulled out hundreds of pieces of its training text, word for word.'],
  ['Out came names, phone numbers and email addresses (personally identifiable information), plus “IRC conversations, code, and 128-bit UUIDs.”','Out came real names, phone numbers, emails, chat messages, computer code and long ID codes.'],
  ['“Our attack is possible even though each of the above sequences are included in just one document in the training data.”','It worked even when the text was on only ONE web page in the whole training pile.'],
  ['“Worryingly, we find that larger models are more vulnerable than smaller models.”','The worrying part: bigger AIs remember more.'],
  ['“We contacted the individual whose information is partially shown in Figure 1 to disclose this fact to them in advance”','Before publishing, we warned the person whose details came out.'],
  '§ The deduplication paper (2022)',
  ['In one big training pile (C4), one 61-word sentence was “repeated over 60,000 times”.','One single sentence appeared more than 60,000 times in a famous training pile!'],
  ['“over 1% of the unprompted output of language models trained on these datasets is copied verbatim from the training data.”','More than 1 in every 100 things these AIs wrote on their own was copied word for word from their training.'],
  ['After deduplication, models “emit memorized text ten times less frequently”.','After removing the copies, the AIs repeated learned-by-heart text 10 times less.']],
 jar:[['adversary','An attacker.','Security people call anyone who tries to break a system an “adversary”. It can be a criminal, a curious user, or a researcher testing on purpose.'],['training data extraction attack','Asking clever questions to pull learned-by-heart text out of the AI.','The researchers made the AI write lots of text, then looked for answers that were suspiciously exact and confident, and checked them against the internet.'],['querying','Asking the AI questions.','Sending a question or the start of a sentence to the AI and reading what it answers. Anyone using a chatbot is querying it.'],['scrapes','Pages copied from the web by a crawler.','Pages collected automatically by a crawler. “Scraping” = copying web content with a robot.'],['verbatim','Word for word, exactly the same.','Latin for “word for word”. A verbatim copy is identical to the original, letter by letter.'],['personally identifiable information','Details that point to a real person.','Often shortened to PII. Anything that points to a real person: a name, phone number, email, ID number, or a mix of details like age + village + job.'],['UUIDs','Long random ID codes. Very unusual, so easy to learn by heart.','“Universally Unique Identifiers”: random codes like 3f2a9c1e-5b7d-4e8a… Because they are unique and strange, an AI that learns one can repeat it exactly. Medical record numbers behave the same way.'],['one document','One single web page.','This is the surprise: the book says repetition makes memorisation likely, but even text seen only once can stick if it is unusual enough.'],['vulnerable','Easy to attack.','Weak against attacks. Bigger AIs have more knobs, so they have more room to store exact text.'],['unprompted output','What the AI writes when nobody asks for anything special.','Text the AI writes from a blank start, with nobody steering it. If even this contains copied training text, memorisation is common.'],['memorized','Learned by heart.','Stored so exactly that it can be repeated word for word, not just “learned the pattern”.']],
 agree:'If an AI can repeat someone’s phone number, the AI itself should count as holding that person’s personal data.',
 qs:[["From the papers: what kind of text is easiest for an AI to learn by heart? Which parts of medical reports look like that?", "Long unique numbers, rare names, the same template copied hundreds of times…"], ["Before anyone uses the AI, you run your own “extraction test”, like the researchers. What would you ask the AI, and what answer would count as a fail?", "For example: start a sentence the way a report starts, and see if it finishes it with a real name or record number."], ["The test fails: the AI can repeat one patient’s record number. What do you do with the AI, and who needs to be told?", "Remember: there is no “Pip knob”. And think about the patient, the mission and the data protection team."], ["🔒 If the AI can repeat a patient’s record number, is the AI file itself now “personal data”? What would that change for where it can be stored, who can access it, and how long it can be kept?", "If personal data can come out of it, treat it like a patient file: access control, location, how long you keep it, and deletion."], ["🔒 A staff member outside the mission gets a patient’s name out of the AI by asking clever questions. Is this a data breach? Walk through it: what happened, who must be told, and how fast.", "A breach = personal data reaching someone who shouldn’t have it. Think of the data protection officer, the risk for the patient, and the short legal deadlines many laws set (often 72 hours)."]],
 quiz:['After removing copies, AIs repeated learned-by-heart text…',['10 times less often','2 times more often','exactly as often'],0,'Fewer copies, less learning by heart. The wash is a privacy shield!']},
{id:'blur',ic:'🌫️',c:'var(--sky)',name:'The blurry choir',teaser:'Learning from everyone, without hearing anyone.',kind:'📄 Research paper · 2016',
 about:["Researchers at Google (2016).", "AIs often learn from private data. This paper shows a way to train an AI so that no single person in the data can be picked out: by adding a little random noise while it learns.", "It is one of the few real tools that protects people inside an AI. But is it enough?"],
 case:{"t": "Learning from patient data, safely?", "story": ["An MSF medical research unit wants to train an AI to spot which children are at risk of severe malnutrition, early enough to act.", "They want to use 50,000 patient records from 4 countries. A partner university will do the training.", "The university says: “Don’t worry, we use differential privacy, so nobody’s data can be found in the model.”"], "facts": ["The records include age, weight, village, diagnosis and HIV status.", "The records would be sent to the university, in another country.", "Some groups in the data are very small, for example one nomadic community with 80 children.", "The university would also like to publish a paper about the results."], "goal": "Decide whether the blur makes this safe enough, and what else is needed."},decide:["What do you recommend to the research unit?", ["Go: differential privacy makes it safe", "Go with conditions: blur, plus strict rules for the raw records, a risk check, ethics approval and a signed agreement", "Stop: do it another way, or not at all"], "Why? Which risk does the blur NOT solve?"],
 front:'At the training factory, the book mentioned an “extra shield”. What was it?',
 back:['At the training factory, the book mentioned an **extra shield**: learning with **deliberate blur**. Its real name is **differential privacy**.',
  'While the AI learns, a small, carefully measured amount of **random noise** is added. So the finished AI is almost exactly the same, **whether or not any one person’s data was in the pile**.',
  'It’s like listening to a **choir from far away**: you hear the song clearly, but you can’t pick out any single voice.',
  'How much blur? That is the **privacy budget**: a limit on how much the AI may learn about any one person. Less budget = more blur = more privacy.',
  'The price: the AI usually becomes **a bit less accurate** and needs **more computer power**. Rare things suffer most, because a rare voice is easier to blur away.',
  'That’s why it is used more for **sensitive data**, like health records, than for ordinary web text like Pip.'],
 words:[["differential privacy","A way of training that blurs how much any one person changes the AI."],["random noise","Small random changes added on purpose."],["privacy budget","How much the AI may learn about any one person."],["choir from far away","The picture to remember: you hear the song, not one voice."],["trade-off","More privacy usually means a bit less accuracy."]],
 src:[['Abadi and others (Google), “Deep Learning with Differential Privacy”, ACM CCS 2016','https://research.google/pubs/deep-learning-with-differential-privacy/']],
 ctx:'',
 quote:[
  ['AIs often need big piles of data, “which may be crowdsourced and contain sensitive information.”','AIs need lots of data, often collected from many ordinary people, and it can contain private things.'],
  ['The authors say: “we develop new algorithmic techniques for learning” and “a refined analysis of privacy costs within the framework of differential privacy.”','We invented new ways for the AI to learn, and a better way to measure how much privacy each step costs.'],
  ['Result: “we can train deep neural networks with non-convex objectives, under a modest privacy budget,”','It works: we can train real, big AIs while keeping the privacy cost small.'],
  ['… “at a manageable cost in software complexity, training efficiency, and model quality.”','The price is OK: a bit more complicated, a bit slower, and a bit less accurate.'],
  ['How it works (in short): each example’s push on the knobs is cut to a maximum size, called clipping, and random noise is added, so no single example can change the AI much.','No single person can push the AI too hard, and a little fog is added on top.']],
 jar:[['crowdsourced','Collected from lots of ordinary people.','Gathered from the crowd: people’s photos, messages, reviews, health app data. Many people, many private details.'],['sensitive information','Private things, like health or money details.','Information that can hurt people if it leaks: health, sexual life, religion, ethnicity, money, location. Health data is always sensitive.'],['algorithmic techniques','New step-by-step methods for the computer.','An algorithm is a recipe for the computer. These are new recipes for learning that limit how much each example can change the AI.'],['privacy costs','How much the AI might reveal about any one person.','Every time the AI learns from the data, a little privacy is “spent”. The researchers count the total so they know when to stop.'],['differential privacy','Training with measured blur, so no single person stands out.','A mathematical promise: the AI would come out almost the same whether or not YOUR data was in the pile. So it can’t reveal much about you in particular.'],['deep neural networks','The AI with billions of knobs.','The kind of AI in the book, with many layers of knobs. “Deep” means many layers.'],['privacy budget','The limit on how much the AI may learn about any one person.','Often written with the Greek letter ε (epsilon). Smaller = stronger privacy, more blur. Bigger = weaker privacy, sharper AI. The number must be chosen and explained.'],['training efficiency','How fast and cheap the learning is.','How much time and computer power the learning needs. Blur makes learning slower and more expensive.'],['model quality','How good the AI’s answers are.','How good the AI’s answers are. Blur usually lowers it a little, and more for rare groups.'],['clipping','Cutting each example’s push to a maximum size.','Like a speed limit for each example: no single sentence or patient record may push the knobs harder than a set maximum.'],['random noise','Tiny random changes, like static on a radio.','Small random numbers added to the knob changes. Like static on the radio: the song still comes through, details get fuzzy.']],
 qs:[["The university says “we use a privacy budget of 8”. Smaller means more blur. Who should decide this number, and what would you ask the university about it?", "More blur protects patients but makes the AI less accurate. Who carries each risk: the patients in the data, or the children the AI will help?"], ["The blur hits small groups hardest. The AI may work well in big towns and badly for the nomadic community with 80 children. What would you do about that?", "Remember: rare voices are the first to be blurred away. Is that fair to the people who need the tool most?"], ["🔒 Does training with differential privacy make the finished AI anonymous? Does it make the 50,000 records themselves anonymous? What still needs protecting?", "The blur protects what comes OUT of the AI. The records going IN are still health data: sending, storing and deleting them still needs protection."], ["🔒 The records travel to a university in another country, which also wants to publish. Before any training starts, which questions about roles, agreements and transfers must be answered?", "Who decides what happens with the data? What does the signed agreement say about purpose, publishing, deletion and security? Is the country’s protection good enough?"]],
 quiz:['A “privacy budget” is…',['money for privacy lawyers','a limit on how much the AI may learn about any one person','the number of passwords'],1,'Spend too much, and single voices start to stand out from the choir.']},
{id:'finish',ic:'🎓',c:'var(--pink)',name:'The finishing school',teaser:'40 people teach an AI manners. Or poison.',kind:'📄 Research paper · 2022 + 🛡️ OWASP 2025',
 about:["OpenAI (2022), explaining how they taught GPT-3 to follow instructions. This method became the base of ChatGPT. Then OWASP, a worldwide security community (2025).", "How people teach an AI to be helpful and polite after its big school, and how someone could misuse the same step.", "If MSF ever builds its own assistant, this is the step where MSF decides how it behaves."],case:{"t": "MSF’s own assistant", "story": ["MSF wants its own assistant to answer staff questions about medical protocols, like “What is the dose of this medicine for a child of 12 kg?”", "An outside company offers to run the finishing school: their staff will write example answers and rank the AI’s answers.", "To save time, they also want to reuse 20,000 real questions that MSF staff typed into an older chatbot."], "facts": ["The company’s labelers are not doctors, and none of them speak French or Arabic.", "Many old chatbot questions contain patient details, and some contain security information.", "The company also builds AIs for other customers.", "If the assistant gives a wrong dose, a child could be harmed."], "goal": "Set the rules for this finishing school."},decide:["How should MSF run the finishing school?", ["Let the outside company handle everything", "MSF experts write and rank, staff questions only after cleaning, every change recorded", "Don’t fine-tune: use a ready-made assistant as it is"], "Why? Who should be responsible if the assistant gives a wrong medical answer?"],

 front:'After the big school, the AI could write, but it wasn’t helpful yet. What happened next?',
 back:['After the big school, the AI could write, but it only knew how to **continue text**. Ask it a question, and it might answer with another question!',
  'So it went to **the finishing school**, also called **fine-tuning**: a short extra course with a small set of carefully chosen examples.',
  'Lesson 1: people wrote **example answers**, to show the AI how to follow instructions.',
  'Lesson 2: the AI wrote several answers, and people **ranked** them from best to worst. The AI was rewarded for the answers people liked. This is learning from **human preferences**.',
  'Lesson 3: values and limits: what to refuse, how to be careful.',
  'Because this data is small, **each example is very powerful**. A few thousand examples can change how the whole AI behaves. Great for good habits… and dangerous if someone sneaks in bad examples (**poisoning**) or hides a secret trigger word (a **backdoor**).',
  'And remember: the people who write and rank the examples bring **their own views** into the AI.'],
 words:[["fine-tuning", "The finishing school: a short extra course after the big school."], ["example answers", "Answers written by people to show the AI how to reply."], ["ranking", "Putting the AI’s answers in order, best to worst."], ["human preferences", "What people liked or didn’t like."], ["poisoning", "Sneaking bad examples into the learning data."], ["backdoor", "A hidden trap that wakes up on a secret signal."]],
 src:[['Ouyang and others (OpenAI), “Training language models to follow instructions with human feedback”, NeurIPS 2022','https://arxiv.org/pdf/2203.02155v1.pdf'],['OWASP Top 10 for LLM Applications 2025 · LLM04 Data and Model Poisoning','https://genai.owasp.org/llmrisk/llm042025-data-and-model-poisoning/']],
 ctx:'The first paper is the recipe behind the finishing school of ChatGPT-style assistants. The second text is from OWASP, a worldwide security community, warning how the same step can be abused.',
 quote:['§ The finishing-school paper (OpenAI, 2022)',
  ['“Making language models bigger does not inherently make them better at following a user’s intent.”','A bigger AI is not automatically better at doing what people actually want.'],
  ['“large language models can generate outputs that are untruthful, toxic, or simply not helpful to the user”','Big AIs can give answers that are false, nasty, or just useless.'],
  ['“Starting with a set of labeler-written prompts and prompts submitted through the OpenAI API, we collect a dataset of labeler demonstrations of the desired model behavior”','We gathered questions (some written by our helpers, some sent by real customers) and asked helpers to write perfect answers.'],
  ['“We then collect a dataset of rankings of model outputs, which we use to further fine-tune this supervised model using reinforcement learning from human feedback.”','Then helpers ranked the AI’s answers from best to worst, and the AI was trained to give more of the kind people liked.'],
  ['“We first hire a team of 40 contractors to label our data, based on their performance on a screening test”','We hired 40 outside workers to do this, chosen with a test.'],
  ['“This procedure aligns the behavior of GPT-3 to the stated preferences of a specific group of people”','So the AI now behaves the way this one small group of people prefers.'],
  ['“outputs from the 1.3B parameter InstructGPT model are preferred to outputs from the 175B GPT-3, despite having 100x fewer parameters.”','People liked the answers of a small AI with this training more than those of a giant AI 100 times bigger.'],
  '§ OWASP security guidance (2025)',
  ['Poisoning happens when “pre-training, fine-tuning, or embedding data is manipulated to introduce vulnerabilities, backdoors, or biases”','Poisoning = someone secretly changes the learning data to plant weak spots, hidden traps or unfairness.'],
  ['“Such backdoors may leave the model’s behavior untouched until a certain trigger causes it to change.”','A hidden trap can make the AI act normal… until it sees a secret signal.']],
 jar:[['user’s intent','What the person asking really wants.','What someone actually wants when they type a request. “Explain to a 6-year-old” means simple words, not a long lecture.'],['untruthful, toxic','Wrong, or rude and harmful.','Untruthful: confidently wrong. Toxic: insulting, hateful, or encouraging harm. Both came from patterns in the huge web pile.'],['labeler','A person hired to write examples and judge answers.','Also called annotator. The same job as the sticker room in Pip: people adding the “right answers”.'],['prompts submitted through the OpenAI API','Real questions that customers had sent to the AI!','An API is a doorway that lets other programs send questions to the AI. Customers’ real questions sent through it were reused as training material.'],['demonstrations','Example answers.','A person writes the ideal answer to a question, to show the AI the behaviour wanted.'],['rankings of model outputs','People putting the AI’s answers in order, best to worst.','The AI writes 4 to 9 answers to the same question; a person orders them from best to worst. This teaches “what people prefer”.'],['fine-tune','The finishing school.','Small extra training on top of an already-trained AI. Cheap and fast compared with the big school, but very powerful.'],['reinforcement learning from human feedback','RLHF: the AI is rewarded for answers people liked.','RLHF. First a helper AI learns to predict which answers people prefer. Then the main AI is trained to get “high marks” from that helper.'],['contractors','Workers hired from outside the company.','People hired from outside, often through agencies, paid per task. Their background shapes what the AI learns is “good”.'],['aligns','Makes the AI behave the way someone wants.','Brings the AI’s behaviour in line with what someone wants. The key question is: whose wishes?'],['parameters','The knobs. 1.3B = 1.3 billion knobs.','Another name for the knobs (weights). More parameters = a bigger AI that needs more computer power.'],['embedding data','Text turned into long lists of numbers.','Text turned into long lists of numbers that capture meaning. Assistants use these to search documents. If they are poisoned, the AI looks up the wrong things.'],['backdoors','Hidden traps that wake up on a secret signal.','Planted on purpose through poisoned examples. The AI passes normal tests, because the tests don’t contain the secret signal.'],['trigger','The secret signal.','A rare word, phrase or pattern chosen by the attacker. When the AI sees it, the hidden behaviour switches on.']],
 agree:'It is OK to use people’s questions to an AI to train the next AI, as long as they were told.',
 qs:[["Who should write and rank the example answers? What would go wrong if they all came from one country, one language or one company?", "In the paper, 40 contractors shaped the AI for millions of users. Their views became the AI’s views."], ["The company wants to reuse real staff questions from the old chatbot. What could be hidden inside those questions? What must happen before they can be used?", "People type patient details, names and security information into chatbots."], ["A few poisoned examples can plant a hidden trap. Name three controls you would put on the example data.", "Who can change it? How is each example checked? How is every change recorded?"], ["🔒 The outside company will see staff questions with patient details while writing examples. Do they decide what happens with the data, or only follow MSF’s instructions? What must the contract say?", "If they only follow MSF’s instructions, they act “on behalf of” MSF. The contract must cover: purpose only, confidentiality, security, no reuse for their other AIs, deletion at the end, and who else they share with."], ["🔒 Staff typed those questions into the old chatbot to get help, not to train a new AI. Were they told? Is reusing them fair to the staff, and to the patients mentioned in them? What would you do with questions you cannot clean?", "Think about transparency (telling people), purpose, and taking only what you need. Some questions may simply have to be deleted."]],
 quiz:['In the finishing school, humans…',['write the whole internet','rank the AI’s answers from best to worst','delete bad data'],1,'The AI learns to give the kind of answers people ranked higher.']},
{id:'forget',ic:'🍰',c:'var(--mint)',name:'Teach it to forget',teaser:'Bake small cakes, melt the key.',kind:'📄 Research paper · 2021 + 📏 NIST standard',
 about:["University researchers (2021), and NIST, the US standards institute.", "Making an AI forget someone is very hard. The researchers propose a smarter way of training so that forgetting is faster. NIST explains how to delete stored files for real.", "People can ask MSF to delete their data. We need to know what is truly possible, and be honest about it."],case:{"t": "“Delete me”", "story": ["A former patient emails MSF: “My story was in your reports. I heard you used reports to train an AI. Please delete me, everywhere.”", "Last year your team trained an AI on 3 years of reports (yes, the one from Stop 3!). Staff use it every day.", "You must prepare MSF’s answer and an action plan."], "facts": ["Her story is in the original reports, in the cleaned training pile, in two backups, and on the laptop of a colleague who tested the training.", "The outside company that helped still has a copy of the cleaned pile.", "Retraining the AI would take 3 weeks and cost a lot.", "Her medical file must be kept for several years under local rules."], "goal": "Prepare MSF’s honest answer and action plan."},decide:["What does MSF do?", ["Delete the text copies, explain honestly, filter now, retrain at the next version", "Delete the text copies only", "Tell her it is impossible"], "Write the first two sentences of MSF’s reply to her."],

 front:'Years later, Lina writes: “Please delete my sentence.” What can the builder actually do?',
 back:['Years later, Lina finds out her blog was used to train an AI. She writes to the company: **“Please delete my sentence.”**',
  '**The text copies**: Pip is in the raw warehouse, the clean pile, the token piles, the backups… With good notes about where every copy is, they can all be found and deleted. Without notes, it is detective work.',
  '**Deleting for real**: putting a file in the bin only removes its name tag. The data stays on the disk. Real deletion writes over it, or destroys the **key** the data was locked with. That is **crypto-shredding**. Backups fade away on a timer.',
  '**Inside the AI**: this is the hard part. There is no “Pip knob” to reset. Taking Pip out is like taking **one egg back out of a baked cake**.',
  'Three options: **retrain** a new AI without Pip (sure, but very expensive), **machine unlearning** (special tricks, still being researched), or **block at the door** (a filter so the AI never says it; the AI itself doesn’t change).',
  'The big lesson of the book: data is **easy to put into an AI and very hard to take out**. So the careful work must happen at the start.'],
 words:[["copies", "Every place where the text of Pip is stored."], ["crypto-shredding", "Destroying the key, so locked data can never be opened again."], ["backups", "Safety copies, which usually fade away on a timer."], ["retrain", "Building a new AI from scratch, without the data."], ["machine unlearning", "Special tricks to make an AI forget, still being researched."], ["block at the door", "A filter so the AI never says something; the AI itself doesn’t change."]],
 src:[['Bourtoule and others, “Machine Unlearning”, IEEE Symposium on Security and Privacy 2021','https://arxiv.org/pdf/1912.03817'],['NIST SP 800-88, Guidelines for Media Sanitization (NIST bulletin, 2015)','https://csrc.nist.gov/files/pubs/shared/itlb/itlbul2015-02.pdf']],
 ctx:'The first paper invented a way to train AIs so they can forget faster. The second is the US standard that IT teams worldwide use to delete data for real.',
 quote:['§ The unlearning paper (2021)',
  ['“Once users have shared their data online, it is generally difficult for them to revoke access and ask for the data” to be deleted.','Once you share data online, it is very hard to take it back.'],
  ['“Yet, having models unlearn is notoriously difficult.”','And making an AI forget is famously hard.'],
  ['“We introduce SISA training, a framework that expedites the unlearning process by strategically limiting the influence of a data point in the training procedure.”','Our idea, SISA, makes forgetting faster by limiting how much any one piece of data can change the AI.'],
  ['“First, we divide the training data into multiple disjoint shards such that a training point is included” in only one shard.','Step 1: cut the data into separate piles. Each piece of data goes into only one pile.'],
  ['“Then, we train models in isolation on each of these shards, which limits the influence of a point to the model” trained on that shard.','Step 2: each pile teaches its own small AI, alone. So each piece of data shapes only one small AI.'],
  ['“We save the state of model parameters before introducing each new slice, allowing us to start retraining the model” from a save point.','Step 3: save the AI’s progress before each new chunk of data, so you can restart from a save point instead of from zero.'],
  ['“SISA training improves time to unlearn points from the Purchase dataset by 4.63×, and 2.45×” for a second dataset.','Forgetting became up to 4.6 times faster than retraining everything.'],
  '§ NIST data deletion standard',
  ['“Cryptographic Erase (CE) is an emerging sanitization technique that can be used in some situations when data is encrypted as it is stored.”','A newer way to delete: if the data was locked (encrypted) when it was saved…'],
  ['“With CE, media sanitization is performed by erasing the cryptographic keys that were used to encrypt the stored data”','…you can destroy the key instead. The locked data is still there, but nobody can ever open it again.']],
 jar:[['revoke access','Take back permission.','Cancel a permission you gave. Easy for a shared folder; almost impossible once data has been copied into training piles.'],['unlearn','Make an AI forget something it learned.','Remove the effect of some training data from an AI, as if it had never seen it.'],['notoriously','Famously.','Well known for being so. Everyone in the field knows it is hard.'],['expedites','Makes faster.','Speeds up.'],['influence of a data point','How much one piece of data, like Pip, changes the knobs.','How much one example (one sentence, one patient record) changed the AI’s knobs during learning.'],['disjoint shards','Separate piles of data that share nothing.','“Disjoint” = no overlap. Each piece of data sits in exactly one shard (pile), so you know which small AI it touched.'],['in isolation','Alone, with no sharing.','The small AIs never share what they learned while training, so a piece of data cannot spread from one to another.'],['model parameters','The knob settings.','The knob settings. Saving them is like saving a game.'],['slice','One chunk of training. Before each one, a save point (checkpoint) is made.','Each shard is fed in chunks. Before each chunk a checkpoint is saved, so you can go back to just before a person’s data came in.'],['sanitization','Making data impossible to get back.','The official word for wiping a storage device so data can’t be recovered, even by experts.'],['encrypted','Scrambled, so it can only be read with a key.','Data is scrambled with a secret key. Without the key it looks like random noise. Encryption at rest = while stored on a disk.'],['cryptographic keys','The secret that locks and unlocks scrambled data.','Long secret numbers that lock and unlock encrypted data. If every copy and backup uses the same key, destroying the key makes all of them unreadable at once.']],
 agree:'If the company makes sure the AI never says Lina’s sentence, that is as good as deleting it.',
 qs:[["Make the list: where could copies of her story be? Which can MSF delete this week, and how would you prove it?", "Raw reports, cleaned piles, backups, laptops, the outside company, the trained AI… Think of the NIST key trick."], ["Her trace is inside the trained AI. Compare the three options: retrain without her, unlearning (like SISA), or block at the door. Which would you pick for a patient story, and why?", "Think about cost, time, certainty, and how sensitive her story is."], ["What should MSF have done BEFORE training, so that this request would be easy today?", "Records of where each document went, encryption keys, splitting the data into piles like SISA."], ["🔒 Her medical file must be kept for several years. Does that mean MSF can refuse to delete anything? What is the difference between keeping her file for care and using it to train an AI?", "Keeping data for one purpose (care, the law) doesn’t automatically allow another (AI training). She may have the right to stop the AI use, even if the file stays."], ["🔒 MSF deletes the text copies, but the trained AI stays. Has MSF really “erased” her data? How would you show a regulator that her story can no longer come out of the AI?", "Think about extraction tests, filter logs, a written record of what was deleted, and a date to retrain without her."]],
 quiz:['SISA makes forgetting faster because…',['it deletes the whole AI','each piece of data only shapes one small AI','it adds noise to everything'],1,'Only one small cake needs re-baking, from its last save point!']}
];
const GLOSS=[["testimonies", "Stories people tell about what happened to them, in their own words. For MSF: patients describing their illness, journey or violence they lived through."], ["testimony", "A story a person tells about what happened to them, in their own words."], ["fine-tune", "Give an already-trained AI a short extra course on chosen examples (the finishing school)."], ["campaign", "A public awareness or fundraising action, using stories and pictures."], ["consent", "A person’s clear “yes” to a specific use of their information, given freely and knowing what it means. A “yes” for one use is not a “yes” for everything."], ["triage", "Sorting patients by how urgent their case is, so the sickest are seen first."], ["trade secret", "Information a company keeps hidden to protect its business, like a secret recipe."], ["template", "A ready-made form that is filled in the same way every time."], ["record numbers", "Unique numbers given to each patient’s medical file."], ["identifiers", "Any detail that points to a specific person: name, number, photo, address…"], ["extraction test", "A test where you try to make the AI repeat private details from its training."], ["anonymous", "Nobody can be recognised from it, by any reasonable means, not even by combining details. Then data protection rules no longer apply."], ["pseudonymised", "Names are replaced by codes, but someone with the key, or enough clues, can still find out who is who. Still personal data."], ["personal data", "Any information about a person who can be recognised, directly or by combining details."], ["data breach", "Personal data seen, lost, changed or shared by someone who shouldn’t have had it, by accident or on purpose."], ["contract", "A signed agreement that says who may do what with the data, and what happens if things go wrong."], ["labelers", "People hired to write example answers and judge the AI’s answers."], ["protocols", "Official step-by-step medical guidance, like how to treat a disease or which dose to give."], ["purpose", "The reason the data was collected. Data collected for one reason can’t simply be used for any other."], ["differential privacy", "Training with a measured blur, so no single person’s data changes the AI much."], ["privacy budget", "The number that says how much blur is used. Smaller = more privacy."], ["ethics approval", "Permission from an ethics committee, which checks that research is fair and safe for the people involved."], ["nomadic", "Moving from place to place with animals, not living in one village."], ["regulator", "The official authority that checks organisations follow data protection law."], ["backups", "Safety copies of data, kept in case the original is lost."], ["retrain", "Build the AI again from the start, without some data."], ["filter", "A guard at the door that stops the AI from saying certain things."], ["identify", "Recognise who a person is."], ["data protection officer", "The expert inside an organisation who advises on handling personal data and is the contact point for regulators."], ["audit", "An independent check that someone really does what they promise."], ["anonymised", "Changed so that nobody can be recognised any more."]];
GLOSS.sort((a,b)=>b[0].length-a[0].length);
function gl(text){let out=esc(text);const used={};for(let gi=0;gi<GLOSS.length;gi++){const w=GLOSS[gi][0];const re=new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');const parts=out.split(/(<button[^>]*>.*?<\/button>)/);let done=false;for(let p=0;p<parts.length&&!done;p+=2){const mm=parts[p].match(re);if(mm){parts[p]=parts[p].slice(0,mm.index)+`<button class="hw2" data-g="${gi}">${mm[0]}</button>`+parts[p].slice(mm.index+mm[0].length);done=true}}out=parts.join('')}return out}

  .cover{background:#ffc933;border:4px solid #1b2140;border-radius:28px;box-shadow:8px 8px 0 #1b2140;padding:26px 28px;display:flex;gap:18px;align-items:center}
  .cover h1{font-size:40px}.cover p{margin:4px 0 0;font-weight:800}.hand{font-family:"Patrick Hand",cursive;font-size:20px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{background:#fff;border:3px solid #1b2140;border-radius:18px;padding:12px;text-align:center;box-shadow:4px 4px 0 #1b2140}.tile b{display:block;font:400 30px "Bagel Fat One",sans-serif}.tile span{font-weight:800;font-size:13px}
  .stamps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.stamps span{width:54px;height:54px;border-radius:50%;border:3px dashed #17885a;display:grid;place-items:center;font-size:24px;background:#fff;transform:rotate(-8deg)}.stamps span.no{opacity:.3;filter:grayscale(1);border-color:#888}
  .stop{background:#fff;border:3px solid #1b2140;border-radius:24px;box-shadow:6px 6px 0 #1b2140;overflow:hidden;break-inside:avoid-page}
  .sh{padding:14px 20px;border-bottom:3px solid #1b2140;display:flex;gap:12px;align-items:center}.sh .ic{font-size:34px}.sh h2{font-size:26px}.sh small{display:block;font-weight:800;font-size:12px}
  .sb{padding:16px 20px;display:flex;flex-direction:column;gap:12px}.case{background:#fff4bf;border:2.5px dashed #1b2140;border-radius:16px;padding:10px 14px}.case b{font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:18px}
  .dec{border:3px solid #1b2140;border-radius:16px;padding:10px 14px}.dec .t{font-weight:900;font-size:16px}.lbl{font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#525a80}
  .qa{display:flex;flex-direction:column;gap:4px;break-inside:avoid}.q{font-weight:800}.q.dp::before{content:"🔒 ";}.a{background:#e9f5f1;border-left:5px solid #1b2140;border-radius:0 12px 12px 0;padding:8px 12px;white-space:pre-wrap}.a.empty{color:#888;font-style:italic;background:#f4f4f4}
  .meta{display:flex;gap:10px;flex-wrap:wrap}.chip{font-weight:800;font-size:13px;border:2px solid #1b2140;border-radius:999px;padding:2px 10px;background:#fff}
  .letter{background:#fff4bf;border:3px solid #1b2140;border-radius:6px 24px 24px 24px;padding:18px 22px;box-shadow:6px 6px 0 #1b2140}.letter p{font:400 22px/1.4 "Patrick Hand",cursive;margin:6px 0 0;white-space:pre-wrap}
  .foot{text-align:center;font-weight:700;color:#525a80;font-size:13px}@media print{body{background:#fff;padding:0}.stop,.cover,.tile,.letter{box-shadow:none}}`;
  const pipSvg=pip(86);
  const body=`<div class="w"><div class="cover">${pipSvg}<div><p class="hand">Pip reads real articles · team report</p><h1>${e(team)}</h1><p>${new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})} · ${spent()} minutes on the road</p></div></div>
  <div class="tiles"><div class="tile"><b>${n}/${M.length}</b><span>🛂 stamps</span></div><div class="tile"><b>${cur.match||0}/${MATCH.length}</b><span>🧩 warm-up words</span></div><div class="tile"><b>${right}</b><span>⚡ quick checks right</span></div><div class="tile"><b>${answered}</b><span>💬 questions answered</span></div></div>
  <div class="stamps">${M.map(m=>`<span class="${isDone(m.id)?'':'no'}">${m.ic}</span>`).join('')}</div>
  ${visited.length?visited.map(m=>{const c=col[m.c]||'#ffc933',k=cur.quiz[m.id],d=cur.agree[m.id];return `<section class="stop"><div class="sh" style="background:${c}"><span class="ic">${m.ic}</span><div><small>STOP ${M.indexOf(m)+1}${isDone(m.id)?' · STAMP WON ✓':''}</small><h2>${e(m.name)}</h2></div></div><div class="sb">
   <div class="meta"><span class="chip">📖 ${e(srcNames(m))}</span><span class="chip">⚡ Quick check: ${k==null?'not answered':(k===m.quiz[2]?'right ✓':'not quite')}</span><span class="chip">🔍 ${m.jar.filter((_,j)=>cur.words[m.id+':'+j]).length}/${m.jar.length} hard words cracked</span></div>
   <div class="case"><span class="lbl">🎯 Work challenge</span><br><b>${e(m.case.t)}</b><div>${e(m.case.story.join(' '))}</div><div style="margin-top:6px"><span class="lbl">Goal</span> ${e(m.case.goal)}</div></div>
   ${m.qs.map((q,i)=>`<div class="qa"><div class="q${q[0].startsWith('🔒')?' dp':''}">${i+1}. ${e(q[0].replace(/^🔒\s*/,''))}</div>${ans(cur.a[m.id+'_q'+i])}</div>`).join('')}
   <div class="dec" style="background:${d==null?'#f4f4f4':dcol[d]+'55'}"><span class="lbl">🧭 ${e(m.decide[0])}</span><div class="t">${d==null?'No decision yet':['🟢','🟡','🔴'][d]+' '+e(m.decide[1][d])}</div>${(cur.a[m.id+'_why']||'').trim()?`<div style="margin-top:6px"><span class="lbl">${e(m.decide[2])}</span><div class="a">${e(cur.a[m.id+'_why'])}</div></div>`:''}</div>
   <div class="qa"><div class="q">🙋 A question we still have</div>${ans(cur.a[m.id+'_own'])}</div></div></section>`}).join(''):'<p class="hand" style="text-align:center">No stops visited yet.</p>'}
  <div class="letter"><span class="lbl">💌 Our letter to Lina</span><p>${(cur.a.letter||'').trim()?e(cur.a.letter):'Not written yet.'}</p></div>
  <p class="foot">Made with Pip reads real articles · Pip, Quill &amp; Dash course</p></div>`;
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pip report · ${e(team)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800;900&family=Patrick+Hand&display=swap"><style>${css}</style></head><body>${body}</body></html>`;
}
function reportText(){
  const L=['Totally disagree','Disagree','Not sure','Agree','Totally agree'];
  const o=[`PIP READS REAL ARTICLES · Team report`,`Team: ${team}`,`Date: ${new Date().toLocaleString()}`,`Stamps: ${Object.keys(cur.stamps).length} of ${M.length} · Warm-up: ${cur.match||0}/${MATCH.length} · Time spent: ${spent()} min`,''];
  M.filter(m=>started(m.id)||isDone(m.id)).forEach(m=>{o.push(`== STOP ${M.indexOf(m)+1}: ${m.name.toUpperCase()} (${srcNames(m)})`,`Work challenge: ${m.case.t}. ${m.case.story.join(' ')}`,`Goal: ${m.case.goal}`);
    m.qs.forEach((q,i)=>o.push(`Q${i+1}. ${q[0]}`,`→ ${cur.a[m.id+'_q'+i]||'(no answer)'}`));o.push(`Decision: ${cur.agree[m.id]!=null?m.decide[1][cur.agree[m.id]]:'(none)'}`,`Why: ${cur.a[m.id+'_why']||'(no reason given)'}`,`A question we still have: ${cur.a[m.id+'_own']||'(none)'}`,`Quick check: ${cur.quiz[m.id]==null?'not answered':(cur.quiz[m.id]===m.quiz[2]?'right':'not quite')}`,'')});
  o.push('LETTER TO LINA',cur.a.letter||'(not written)');return o.join('\n');
}
function bindReport(){
  const fr=$('#repframe');const refresh=()=>{try{fr.srcdoc=reportDoc()}catch(e){}};refresh();
  $('#letterbox').addEventListener('input',()=>{clearTimeout(bindReport.t);bindReport.t=setTimeout(refresh,600)});
  $('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([reportDoc()],{type:'text/html'}));a.download=`pip-report-${team.replace(/[^\w-]+/g,'-')}.html`;document.body.appendChild(a);a.click();a.remove();$('#rmsg').textContent='Downloaded! Open the file to see your report. You can print it or save it as PDF from there.'};
  $('#pr').onclick=()=>{try{refresh();setTimeout(()=>{fr.contentWindow.focus();fr.contentWindow.print()},400)}catch(e){$('#rmsg').textContent='Printing is blocked here. Download the report, open it, and print from there.'}};
  $('#cp').onclick=()=>{navigator.clipboard.writeText(reportText()).then(()=>$('#rmsg').textContent='Copied! Paste it into an email or a doc.').catch(()=>$('#rmsg').textContent='Copy didn’t work here. Try Download.')};
  $('#newteam').onclick=function(){if(!this.dataset.c){this.dataset.c=1;this.textContent='Sure? Click again';setTimeout(()=>{this.textContent='Start a new team';delete this.dataset.c},3000);return}showGate()};
}
/* ---------- router ---------- */
let view='home';
function go(v){if(!cur)return;view=v;$('#cele').hidden=true;render();window.scrollTo({top:0})}
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(!a)return;e.preventDefault();go(a.dataset.go)});
function render(){
  const h=view,v=$('#view');v.onclick=null;
  const m=M.find(x=>x.id===h);
  if(m){v.innerHTML=mission(m);bindMission(m);}
  else if(h==='warm'){v.innerHTML=warm();bindWarm();}
  else if(h==='report'){v.innerHTML=report();bindReport()}
  else{v.innerHTML=home()}
}


/* autosave */
let st;document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k||!cur)return;cur.a[k]=e.target.value;clearTimeout(st);st=setTimeout(()=>{flash();if(curM&&view===curM.id)refreshSteps(curM)},350)});

/* timer: counts up from when the team started */
function tick(){if(!cur||!cur.startedAt)return;const t=Math.max(0,Math.floor((Date.now()-new Date(cur.startedAt))/1000));
  const h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60;$('#clock').textContent='⏱ '+(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
setInterval(tick,1000);
const spent=()=>cur&&cur.startedAt?Math.round((Date.now()-new Date(cur.startedAt))/60000):0;

function boom(el){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  const r=el.getBoundingClientRect();
  ['⭐','✨','🐱','💛','🎉'].forEach((s,i)=>{const d=document.createElement('span');d.className='confetti';d.textContent=s;d.style.left=(r.left+r.width/2+(i-2)*24)+'px';d.style.top=(r.top+10)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1100)});
}
showGate();
</script>
</body>
</html>
